plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    mavenLocal()
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://mvn.devos.one/snapshots" } // Registrate
    maven { url = "https://maven.blamejared.com/" }
    exclusiveContent {
        forRepository {
            maven {
                name = "RyanHCode Maven"
                url = "https://maven.ryanhcode.dev/releases"
            }
        }
        filter {
            includeGroup("dev.ryanhcode.sable")
            includeGroup("dev.ryanhcode.sable-companion")
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") { transitive = false }
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}")
    compileOnly("com.dylibso.chicory:runtime:1.7.5")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    runtimeOnly("com.tterrag.registrate:Registrate:${registrate_version}")

    //chicory
    jarJar(implementation("com.dylibso.chicory:runtime")) {
        version {
            strictly '[1.7.5,2.0)'
            prefer '1.7.5'
        }
    }
    jarJar(implementation("com.dylibso.chicory:wasm")) {
        version {
            strictly '[1.7.5,2.0)'
            prefer '1.7.5'
        }
    }
    additionalRuntimeClasspath "com.dylibso.chicory:runtime:1.7.5"
    additionalRuntimeClasspath "com.dylibso.chicory:wasm:1.7.5"

}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

var buildWasm = tasks.register("buildWasm", Exec) {
    workingDir file("src/lib")
    commandLine "cargo", "build", "--release", "--target", "wasm32-unknown-unknown"
    inputs.dir("src/lib/src")
    inputs.file("src/lib/Cargo.toml")
    inputs.file("src/lib/Cargo.lock")
    outputs.file("src/lib/target/wasm32-unknown-unknown/release/create_hs_physics.wasm")
}

var copyWasm = tasks.register("copyWasm", Copy) {
    from buildWasm
    into layout.buildDirectory.dir("generated/wasm")
    rename { "hs_physics.wasm" }
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
sourceSets.main.resources.srcDir copyWasm
neoForge.ideSyncTask copyWasm



idea {
    module {
        downloadSources = true
    }
}
